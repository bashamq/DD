<!DOCTYPE html>
<html>
<head>
    <title>Register Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded shadow-sm max-w-lg" style="max-width: 600px;">
        <h3 class="text-primary mb-4">📝 Register New DD Order</h3>
        <form id="regForm">
            <input type="text" class="form-control mb-2" id="orderId" placeholder="Order ID (e.g. DD-001)" required>
            <input type="text" class="form-control mb-2" id="customer" placeholder="Customer Name" required>
            <input type="text" class="form-control mb-2" id="po" placeholder="PO / RFQ No">
            <input type="text" class="form-control mb-2" id="partName" placeholder="Part Name" required>
            <input type="text" class="form-control mb-2" id="partNo" placeholder="Part No">
            <input type="number" class="form-control mb-2" id="qty" placeholder="Quantity" required>
            <input type="date" class="form-control mb-3" id="dueDate" required>
            <button type="button" class="btn btn-primary w-100" onclick="register()">Submit Order</button>
        </form>
    </div>

    <script>
        // Naya Web App URL yahan update kar diya gaya hai
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjFMoFS1shxxlVRHCkkz0N6UNxgwYLw-l7uwIAqPFpGLdPJLlB2TQkX-S7eQtSNu1A/exec";

        function register() {
            const btn = document.querySelector('button');
            btn.innerText = "Saving...";
            btn.disabled = true;

            const fd = new URLSearchParams();
            fd.append("action", "registerOrder");
            fd.append("orderId", document.getElementById("orderId").value);
            fd.append("customer", document.getElementById("customer").value);
            fd.append("po", document.getElementById("po").value);
            fd.append("partName", document.getElementById("partName").value);
            fd.append("partNo", document.getElementById("partNo").value);
            fd.append("qty", document.getElementById("qty").value);
            fd.append("dueDate", document.getElementById("dueDate").value);

            fetch(SCRIPT_URL, { method: "POST", body: fd })
                .then(res => res.text())
                .then(data => {
                    alert("Order & Master Checklist Created Successfully!");
                    document.getElementById("regForm").reset();
                    btn.innerText = "Submit Order";
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
