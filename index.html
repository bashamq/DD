<!DOCTYPE html>
<html>
<head>
    <title>Live Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4" onload="loadData()">
    <div class="container-fluid bg-white p-4 rounded shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-success">📊 Live DD Dashboard</h3>
            <button class="btn btn-outline-success" onclick="loadData()">Refresh Data</button>
        </div>
        
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Part Name</th>
                        <th>Status / Stage</th>
                        <th>Progress</th>
                        <th>Due Date</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" class="text-center">Loading live data from Google Sheets...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Naya Web App URL yahan update kar diya gaya hai
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjFMoFS1shxxlVRHCkkz0N6UNxgwYLw-l7uwIAqPFpGLdPJLlB2TQkX-S7eQtSNu1A/exec";

        function loadData() {
            document.getElementById("tableBody").innerHTML = "<tr><td colspan='6' class='text-center'>Loading...</td></tr>";
            
            fetch(SCRIPT_URL + "?action=getOrders")
                .then(res => res.json())
                .then(data => {
                    let rows = "";
                    data.forEach(row => {
                        if(row["Order ID"]) {
                            rows += `<tr>
                                <td><strong>${row["Order ID"]}</strong></td>
                                <td>${row["Customer"]}</td>
                                <td>${row["Part Name"]}</td>
                                <td><span class="badge bg-secondary">${row["Status"]}</span></td>
                                <td>
                                    <div class="progress" style="height: 20px;">
                                        <div class="progress-bar bg-success" style="width:${parseInt(row["Overall Progress"])||0}%">${row["Overall Progress"] || '0%'}</div>
                                    </div>
                                </td>
                                <td>${row["Due Date"]}</td>
                            </tr>`;
                        }
                    });
                    document.getElementById("tableBody").innerHTML = rows;
                }).catch(err => {
                    document.getElementById("tableBody").innerHTML = "<tr><td colspan='6' class='text-center text-danger'>Failed to load data.</td></tr>";
                });
        }
    </script>
</body>
</html>
