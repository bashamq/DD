<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chenab Engineering – Work Assignment</title><script src="config.js"></script>
<style>
body{font-family:Arial;background:#f3f5f8;margin:0;color:#172033}.wrap{max-width:1100px;margin:30px auto;padding:20px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-weight:700;font-size:13px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d0d5dd;border-radius:9px;margin-top:6px}button{background:#155eef;color:#fff;border:0;padding:12px 20px;border-radius:9px;font-weight:700}.full{grid-column:1/-1}.msg{padding:12px;border-radius:9px;margin-top:15px}.ok{background:#ecfdf3;color:#027a48}.err{background:#fef3f2;color:#b42318}.hint{color:#667085;font-size:13px}.tasks{margin-top:20px;border-top:1px solid #eee;padding-top:20px}
</style></head>
<body><div class="wrap"><div class="card">
<div style="display:flex;justify-content:space-between"><div><h1>Work Assignment</h1><p class="hint">Assign process steps to departments with dates and responsibility.</p></div><a href="index.html">Home</a></div>
<form id="f"><div class="grid">
<div><label>Part *</label><select id="part" name="PartID" required><option value="">Loading...</option></select></div>
<div><label>Process Section *</label><select name="ProcessSection" id="section" required></select></div>
<div class="full"><label>Task *</label><select name="Task" id="task" required></select></div>
<div><label>Department *</label><select name="Department" required><option>Design / Engineering</option><option>Pattern Shop / Foundry</option><option>Foundry</option><option>Metallurgy / Foundry</option><option>Heat Treatment / QC</option><option>QC / QA</option><option>Production / CNC</option><option>QA</option><option>QC / Approved Lab</option><option>Stores + QA</option></select></div>
<div><label>Assigned To</label><input name="AssignedTo"></div>
<div><label>Start Date *</label><input name="StartDate" type="date" required></div>
<div><label>Due Date *</label><input name="DueDate" type="date" required></div>
<div class="full"><button>Assign Work</button></div>
</div></form><div id="msg"></div>
<div class="tasks"><b>Checklist task library</b><p class="hint">Tasks are based on the uploaded master checklist, from Design/DFM through QA release/dispatch.</p></div>
</div></div>
<script>
const library={
"1. DESIGN & DEVELOPMENT / DFM":[
"Customer RFQ, drawing, 3D CAD, material specification, quantity and application received.",
"Customer requirements and latest drawing revision verified.","Material grade/specification confirmed against customer requirement.",
"DFM review completed: draft, wall thickness, sharp corners, machining accessibility and datum strategy.",
"Machining allowance defined and approved according to material/process requirement.",
"Shrinkage allowance defined for selected alloy and pattern process.","Gating, riser/feeder and venting concept reviewed.",
"Core requirements and core print locations verified.","Tolerance stack-up / critical dimensions identified.",
"UM (unmachined) and M (machined) dimensions identified where applicable.",
"Casting simulation / filling / solidification / hot-spot review completed where required.",
"Pattern and core-box design reviewed and approved.","Design risks and special characteristics identified.",
"Customer approval obtained for controlled design changes where required.",
"Design output released under document/revision control."
],
"2. TOOLING / PATTERN & CORE":["Pattern/core-box drawing matches approved product drawing.","Pattern material and construction verified.","Pattern shrinkage and machining allowances verified.","Pattern dimensions checked and recorded.","Core-box dimensions checked and recorded.","Parting line, draft and core prints verified.","Pattern/core identification and revision marking applied.","Tooling trial completed where required.","Tooling inspection record approved before production."],
"3. FOUNDRY / MOULD & CORE MAKING":["Raw material/scrap identity and condition checked.","Sand type and recipe verified.","Sand moisture checked.","AFS / grain fineness checked where applicable.","Permeability checked.","Compactability checked.","Core sand properties checked.","Core strength checked.","Core venting and baking/curing verified.","Mould hardness/compaction checked.","Pattern condition and mould dimensions verified.","Core setting and orientation verified.","Gating/riser/feeder system verified against approved design.","Mould identification / batch traceability maintained."],
"4. MELTING & METALLURGY":["Charge calculation prepared and approved.","Charge materials identified by grade/heat/batch.","Furnace condition and readiness verified.","Melting temperature monitored.","Chemical composition checked by calibrated spectrometer.","Required chemistry acceptance range verified.","Carbon equivalent calculated where applicable.","Inoculation / nodularization / grain refinement carried out as per approved procedure.","Degassing performed where applicable.","Treatment addition quantity and time recorded.","Test sample/ladle sample identified with heat number.","Metallurgical records retained."],
"5. POURING / SHAKEOUT / FETTLING":["Pouring temperature recorded.","Pouring time and sequence controlled.","Heat/ladle/mould traceability maintained.","Pouring condition visually monitored.","Shakeout time controlled to reduce distortion/cracking risk.","Sand removed completely.","Gates and risers removed.","Fins/flash removed.","Grinding/fettling completed without damaging functional surfaces.","Castings segregated and identified by heat/batch."],
"6. HEAT TREATMENT":["Heat-treatment requirement verified against drawing/specification.","Correct furnace cycle/program selected.","Loading arrangement verified.","Temperature recorded.","Soak/holding time recorded.","Heating/cooling cycle recorded.","Quench medium and condition verified where applicable.","Furnace chart/record reviewed.","Heat-treatment batch traceability maintained.","Post-HT hardness test performed where required.","Microstructure/mechanical verification performed where required."],
"7. CASTING INSPECTION / NDT":["Visual inspection for cracks, cold shuts, misruns, blowholes, inclusions, shrinkage and surface defects.","Critical UM dimensions checked.","Datum/functional casting features verified.","Hardness checked where specified.","NDT method selected according to drawing/customer specification.","MPI performed where required.","UT performed where required.","RT performed where required.","Dye penetrant performed where required.","NDT acceptance criteria verified.","Nonconforming castings identified and segregated."],
"8. MACHINING":["Casting received with part/heat/batch identification.","Pre-machining visual inspection completed.","Approved drawing and revision available at machine.","Correct CNC program verified.","Correct fixture and tooling verified.","Datum selected and marked.","Machine setup verified.","First-piece machining completed.","First-piece approval obtained before batch production.","All M dimensions programmed/controlled.","Tool wear monitored.","Tool breakage/chipping monitored.","In-process inspection performed at defined frequency.","Deburring completed.","Washing and drying completed.","Rust preventive applied where required."],
"9. FINAL INSPECTION / SAMPLE INSPECTION REPORT":["Inspection environment controlled where required: Temperature 24±2°C and Humidity 50±5% RH, if specified.","Latest controlled drawing used.","Drawing Controlled Dimension (D.C.O) transcribed correctly in Inch and MM.","UM / M classification verified.","Nominal dimension recorded.","Tolerance recorded.","Calibrated measuring instrument selected.","Instrument identification and calibration status verified.","Actual observation recorded.","Deviation calculated as: Observation − Nominal.","PASS / FAIL status recorded.","Remarks recorded for deviations.","UM failure routed to casting/root-cause investigation.","M failure routed to machining/root-cause investigation.","Inspection report signed by responsible inspector."],
"10. FINAL TESTING":["Visual final inspection completed.","All critical dimensions accepted.","Tensile test completed where required.","Impact test completed where required.","Hardness test completed where required.","Microstructure test completed where required.","NDT reports attached where required.","Surface finish checked where specified.","Coating/paint thickness checked where applicable.","Customer-specific tests completed."],
"11. NCR / ROOT CAUSE / CAPA":["Nonconforming product identified and physically segregated.","NCR number assigned.","Problem statement and affected quantity recorded.","Immediate containment completed.","Root cause identified using appropriate method (5 Why / Fishbone / process review).","Responsibility assigned: Casting / Metallurgy / Machining / Inspection / Other.","Correction completed.","Corrective action implemented.","Re-inspection/retest completed.","Effectiveness verified.","NCR/CAPA formally closed."],
"12. DOCUMENTATION / TRACEABILITY":["Customer RFQ / PO retained.","Approved drawing and revision retained.","DFM review retained.","Pattern/core-box records retained.","Charge calculation retained.","Spectrometer/chemistry report retained.","Pouring record retained.","Heat-treatment record retained.","Casting inspection record retained.","NDT report retained.","Machining setup/in-process record retained.","Final inspection report retained.","Mechanical test certificates retained.","MTC attached where required.","COC prepared.","All records traceable to heat/batch/part."],
"13. FINAL QA RELEASE / PACKING / DISPATCH":["All inspection/test results reviewed.","All NCRs affecting the shipment closed or formally dispositioned.","Customer documentation package complete.","COC approved.","MTC approved/attached.","Inspection report approved/attached.","Packing method matches customer requirement.","Quantity verified.","Part identification/labels verified.","Packaging protects casting/machined surfaces.","Rust prevention completed where required.","Dispatch authorization given by QA/authorized person.","Dispatch record and traceability retained."]
};

const section=document.getElementById("section"), task=document.getElementById("task");
Object.keys(library).forEach(s=>section.add(new Option(s,s)));
section.onchange=()=>{task.innerHTML="";library[section.value].forEach(t=>task.add(new Option(t,t)));};
section.dispatchEvent(new Event("change"));

(async()=>{try{const r=await api("listParts");part.innerHTML='<option value="">Select part</option>';r.parts.reverse().forEach(x=>part.add(new Option(`${x.PartID} | ${x.OrderNo} | ${x.PartNo} | ${x.PartName}`,x.PartID)));}catch(e){part.innerHTML='<option>'+e.message+'</option>';}})();

f.onsubmit=async e=>{e.preventDefault();msg.className="msg";msg.textContent="Saving...";try{const r=await api("assignWork",Object.fromEntries(new FormData(f)));msg.className="msg ok";msg.textContent="Work assigned. Assignment ID: "+r.assignmentId;f.reset();section.dispatchEvent(new Event("change"));}catch(x){msg.className="msg err";msg.textContent=x.message;}};
</script></body></html>
