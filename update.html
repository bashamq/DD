<!DOCTYPE html>
<html>
<head>
    <title>Daily Update</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
        <h3 class="text-warning mb-4">⚙️ Update Order Status</h3>
        <form id="updateForm">
            <label class="form-label">Order ID</label>
            <input type="text" class="form-control mb-2" id="orderId" placeholder="e.g. DD-001" required>
            
            <label class="form-label">Current Master Stage</label>
            <select class="form-select mb-2" id="status">
                <option>Design & DFM</option>
                <option>Tooling / Pattern</option>
                <option>Foundry / Moulding</option>
                <option>Metallurgy / Pouring</option>
                <option>Machining (CNC)</option>
                <option>Final Inspection</option>
                <option>Ready for Dispatch</option>
            </select>

            <label class="form-label">Overall Progress (%)</label>
            <input type="text" class="form-control mb-3" id="progress" placeholder="e.g. 45%">
            
            <button type="button" class="btn btn-warning w-100 fw-bold" onclick="update()">Push Update</button>
        </form>
    </div>

    <script>
        // Naya Web App URL yahan update kar diya gaya hai
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjFMoFS1shxxlVRHCkkz0N6UNxgwYLw-l7uwIAqPFpGLdPJLlB2TQkX-S7eQtSNu1A/exec";

        function update() {
            const btn = document.querySelector('button');
            btn.innerText = "Updating...";
            
            const fd = new URLSearchParams();
            fd.append("action", "updateOrder");
            fd.append("orderId", document.getElementById("orderId").value);
            fd.append("status", document.getElementById("status").value);
            fd.append("progress", document.getElementById("progress").value);

            fetch(SCRIPT_URL, { method: "POST", body: fd })
                .then(res => res.text())
                .then(data => {
                    alert(data === "Updated" ? "Status Updated!" : "Order ID Not Found!");
                    document.getElementById("updateForm").reset();
                    btn.innerText = "Push Update";
                });
        }
    </script>
</body>
</html>
