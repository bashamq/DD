<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Department Daily Update</title><script src="config.js?v=20260911"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.top h1{margin:0;font-size:24px}.hint,.sub{color:#667085;font-size:13px}.home,.btn{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:10px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:#155eef;color:#fff;border:0}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px #1018280d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.dept,.task{border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:15px;cursor:pointer}.dept{text-align:left}.dept:hover,.task:hover{border-color:#98a2b3}.title{font-weight:800;font-size:15px;line-height:1.45}.bar{height:8px;background:#eaecf0;border-radius:99px;overflow:hidden;margin:12px 0 6px}.bar span{display:block;height:100%;background:#155eef}.badge{display:inline-block;font-size:11px;background:#f2f4f7;padding:5px 8px;border-radius:99px}.task{margin-bottom:10px}.taskhead{display:flex;justify-content:space-between;gap:8px}.msg{padding:11px;border-radius:10px;margin-bottom:12px}.ok{background:#ecfdf3;color:#027a48}.err{background:#fef3f2;color:#b42318}.hidden{display:none}form{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-weight:700;font-size:13px}input,select,textarea{width:100%;margin-top:6px;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}textarea{min-height:100px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.top h1{font-size:20px}form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Department Daily Update</h1><div class="hint">Department → Assigned Tasks → Update Task → Save</div></div><a class="home" href="index.html">Home</a></div>
<div id="msg"></div>
<section id="deptView" class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>Assigned Departments</b><div class="sub">صرف وہ departments دکھیں گے جنہیں work assign ہوا ہے۔</div></div><button class="btn" onclick="loadDepartments()">Refresh</button></div><div id="deptGrid" class="grid" style="margin-top:14px"><div class="hint">Loading...</div></div></section>
<section id="taskView" class="card hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div><b id="deptTitle"></b><div id="taskCount" class="sub"></div></div><button class="btn" onclick="showDepartments()">← Departments</button></div><div id="tasks" style="margin-top:14px"></div></section>
<section id="editView" class="card hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>Update Assigned Task</b><div id="editSub" class="sub"></div></div><button class="btn" onclick="showTasks()">← Tasks</button></div>
<form id="form" style="margin-top:15px"><input id="aid" type="hidden"><input id="dept" type="hidden"><div class="full"><label>Task</label><div id="taskText" style="margin-top:6px;font-weight:700;line-height:1.5"></div></div>
<div><label>Status *</label><select id="status"><option>Pending</option><option>In Progress</option><option>Completed</option><option>On Hold</option></select></div>
<div><label>Progress % *</label><input id="progress" type="number" min="0" max="100" required></div>
<div><label>Update Date *</label><input id="date" type="date" required></div><div><label>Updated By</label><input id="by"></div>
<div class="full"><label>Remarks</label><textarea id="remarks" placeholder="آج کیا کام ہوا؟"></textarea></div>
<div class="full"><label>Evidence / File Link</label><input id="evidence" type="url" placeholder="Optional Google Drive / report link"></div>
<div class="full actions"><button id="save" class="btn primary" type="submit">Save Daily Update</button><button type="button" class="btn" onclick="showTasks()">Cancel</button></div></form></section>
</div>
<script>
let assignments=[],currentDept="";
const $=id=>document.getElementById(id);
function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function msg(t,c="err"){$("msg").innerHTML='<div class="msg '+c+'">'+esc(t)+'</div>'}
function clearMsg(){$("msg").innerHTML=""}
function view(id){["deptView","taskView","editView"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
async function loadDepartments(){clearMsg();view("deptView");$("deptGrid").innerHTML='<div class="hint">Loading departments...</div>';try{let r=await api("listAssignments");assignments=r.assignments||[];let m={};assignments.forEach(a=>{let d=String(a.Department||"").trim();if(d)(m[d]??=[]).push(a)});let ds=Object.keys(m).sort();if(!ds.length){$("deptGrid").innerHTML='<div class="hint">No assigned work found.</div>';return}$("deptGrid").innerHTML=ds.map(d=>{let x=m[d],p=Math.round(x.reduce((s,a)=>s+Number(a.Progress||0),0)/x.length),done=x.filter(a=>Number(a.Progress||0)>=100||String(a.Status||"").toLowerCase()=="completed").length;return `<button class="dept" onclick='openDept(${JSON.stringify(d)})'><div class="title">${esc(d)}</div><div class="sub">${x.length} task(s) · ${done} completed</div><div class="bar"><span style="width:${Math.min(100,Math.max(0,p))}%"></span></div><div class="sub">Progress ${p}%</div></button>`}).join("")}catch(e){$("deptGrid").innerHTML="";msg(e.message)}}
function openDept(d){currentDept=d;let x=assignments.filter(a=>String(a.Department||"").trim()==d);$("deptTitle").textContent=d;$("taskCount").textContent=x.length+" assigned task(s)";$("tasks").innerHTML=x.map(a=>{let p=Number(a.Progress||0);return `<div class="task" onclick='openTask(${JSON.stringify(a).replace(/</g,"\\u003c")})'><div class="taskhead"><div><div class="title">${esc(a.Task)}</div><div class="sub">Part: ${esc(a.PartNo)} · Order: ${esc(a.OrderNo)}${a.DueDate?" · Due: "+esc(a.DueDate):""}</div></div><span class="badge">${esc(a.Status||"Pending")}</span></div><div class="bar"><span style="width:${Math.min(100,Math.max(0,p))}%"></span></div><div class="sub">Progress ${p}% · Tap to update</div></div>`}).join("");view("taskView")}
function openTask(a){$("aid").value=a.AssignmentID||"";$("dept").value=a.Department||"";$("taskText").textContent=a.Task||"";$("editSub").textContent=(a.PartNo||"")+" · "+(a.OrderNo||"");$("status").value=a.Status||"Pending";$("progress").value=Number(a.Progress||0);$("date").value=today();$("by").value="";$("remarks").value=a.Remarks||"";$("evidence").value="";view("editView");scrollTo(0,0)}
function showDepartments(){view("deptView")} function showTasks(){openDept(currentDept)}
$("form").onsubmit=async e=>{e.preventDefault();clearMsg();$("save").disabled=true;$("save").textContent="Saving...";try{let r=await api("updateWork",{AssignmentID:$("aid").value,Department:$("dept").value,UpdateDate:$("date").value,Status:$("status").value,Progress:$("progress").value,Remarks:$("remarks").value,EvidenceLink:$("evidence").value,UpdatedBy:$("by").value});msg(r.message||"Daily update saved.","ok");let f=await api("listAssignments");assignments=f.assignments||[];setTimeout(()=>{clearMsg();openDept(currentDept)},400)}catch(e){msg(e.message)}finally{$("save").disabled=false;$("save").textContent="Save Daily Update"}};
$("date").value=today();loadDepartments();
</script></body></html>
